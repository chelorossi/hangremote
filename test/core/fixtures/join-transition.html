<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MeetRemote test fixture — pre-join then joining the call</title>
  </head>
  <body>
    <!--
      The one transition no other fixture covers: pre-join -> in-call. Meet
      does not keep the pre-join controls around, it re-renders the page, so
      window.join() below replaces the mic/cam with *new* nodes carrying the
      state the user left them in. Any listener content.js attached on the
      pre-join screen is on a detached node afterwards, which is what makes
      re-wiring on screen change load-bearing.
    -->
    <a id="landing" data-present-landing="false" href="#">landing link</a>

    <div role="button" aria-label="Backgrounds and effects">effects</div>
    <div role="button" aria-label="Use Gemini to take notes">gemini</div>

    <div id="controls">
      <span data-is-tooltip-wrapper="true">
        <button role="button" aria-label="Turn on microphone" data-is-muted="false" id="mic-button">mic</button>
      </span>
      <span data-is-tooltip-wrapper="true">
        <button role="button" aria-label="Turn on camera" data-is-muted="false" id="cam-button">cam</button>
      </span>
    </div>

    <script>
      // Displayed state (data-is-muted) versus real state. Captured from prod
      // on 2026-09-14: when Meet swaps in the in-call controls they read
      // data-is-muted="false" for a moment regardless of what the user is
      // actually entering with, and only sync to the real state ~200ms later.
      // A click acts on the *real* state, not on the stale attribute — which
      // is why deciding from the attribute in that window inverts it.
      const real = { "mic-button": false, "cam-button": false };
      let settleTimer = null;

      function paint() {
        for (const id of Object.keys(real)) {
          const el = document.getElementById(id);
          if (el) el.setAttribute("data-is-muted", String(real[id]));
        }
      }

      function wireClicks() {
        for (const id of Object.keys(real)) {
          const el = document.getElementById(id);
          if (!el || el.dataset.wired) continue;
          el.dataset.wired = "1";
          el.addEventListener("click", (event) => {
            const which = event.currentTarget.id;
            real[which] = !real[which];
            setTimeout(paint, 30);
          });
        }
      }
      wireClicks();

      setTimeout(() => {
        document.body.appendChild(document.createElement("span"));
      }, 50);

      window.join = () => {
        document.getElementById("landing").remove();

        const panel = document.createElement("div");
        panel.setAttribute("data-panel-id", "5");
        panel.textContent = "in call";
        document.body.appendChild(panel);

        // Fresh nodes, both reading "false" no matter the real state.
        const controls = document.getElementById("controls");
        controls.innerHTML =
          '<span data-is-tooltip-wrapper="true"><button role="button" aria-label="Turn off microphone" data-is-muted="false" id="mic-button">mic</button></span>' +
          '<span data-is-tooltip-wrapper="true"><button role="button" aria-label="Turn off camera" data-is-muted="false" id="cam-button">cam</button></span>';
        wireClicks();

        // Meet catches the controls up to the real state shortly after.
        clearTimeout(settleTimer);
        settleTimer = setTimeout(paint, 250);
      };

      // Test hook: the real state, which is what the user actually gets.
      window.realState = () => ({ ...real });
    </script>
  </body>
</html>
